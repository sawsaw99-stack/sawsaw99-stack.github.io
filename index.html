<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawyer | Hub & Projects</title>
    
    <!-- Keep Android Open Official Banner Script -->
    <script src="https://keepandroidopen.org/banner.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Keep Android Open Visual Fallback (Shows if banner.js is blocked by an ad-blocker) -->
    <div id="kao-fallback-banner" class="w-full bg-emerald-950/80 border-b border-emerald-500/30 text-emerald-200 px-4 py-2 text-center text-xs sm:text-sm font-medium">
        <span>Support user choice and platform freedom: </span>
        <a href="https://keepandroidopen.org" target="_blank" rel="noopener noreferrer" class="underline hover:text-emerald-100 font-bold ml-1">
            Keep Android Open <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-0.5"></i>
        </a>
    </div>

    <!-- Background glow accents -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl"></div>
    </div>

    <main class="max-w-4xl mx-auto px-4 py-12">
        
        <!-- Profile Header -->
        <header class="text-center mb-10">
            <div class="w-24 h-24 mx-auto mb-4 rounded-3xl bg-gradient-to-tr from-indigo-500 to-emerald-400 p-1 shadow-lg shadow-indigo-500/20">
                <div class="w-full h-full bg-slate-900 rounded-[22px] flex items-center justify-center border border-slate-800">
                    <i class="fa-solid fa-terminal text-3xl text-indigo-400"></i>
                </div>
            </div>
            
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">Sawyer</h1>
            <p class="text-slate-400 text-sm font-medium mb-3">Tinkerer • Creator • Developer</p>
            
            <!-- Dynamic GitHub Activity Status -->
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/80 border border-slate-800 text-xs text-slate-300 backdrop-blur-md shadow-sm">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-500 transition-all duration-300"></span>
                <span id="status-text" class="font-medium">Checking activity...</span>
            </div>
        </header>

        <!-- Socials Carousel -->
        <section class="mb-12">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-share-nodes text-indigo-400"></i> Connect
                </h2>
                <div class="flex gap-2">
                    <button onclick="scrollContainer('socials-track', -280)" class="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-white transition-colors" aria-label="Previous social">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="scrollContainer('socials-track', 280)" class="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-white transition-colors" aria-label="Next social">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <div id="socials-track" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth snap-x snap-mandatory scrollbar-none"></div>
        </section>

        <!-- Projects Carousel -->
        <section class="mb-12">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-code text-emerald-400"></i> Featured Projects
                </h2>
                <div class="flex gap-2">
                    <button onclick="scrollContainer('projects-track', -320)" class="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-white transition-colors" aria-label="Previous project">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button onclick="scrollContainer('projects-track', 320)" class="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-400 hover:text-white transition-colors" aria-label="Next project">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <div id="projects-track" class="flex gap-4 overflow-x-auto pb-2 scroll-smooth snap-x snap-mandatory scrollbar-none"></div>
        </section>

        <!-- Footer -->
        <footer class="text-center pt-8 border-t border-slate-900 text-xs text-slate-500">
            <p>Hosted on GitHub Pages • <a href="https://github.com/sawsaw99-stack" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-300">sawsaw99-stack</a></p>
        </footer>

    </main>

    <script>
        // Inline Datasets (Eliminates local file:// CORS blocks)
        const socialsData = [
            {
                title: "Gravatar",
                handle: "sawyerbraun",
                url: "https://gravatar.com/sawyerbraun",
                icon: "fa-brands fa-grav",
                color: "blue"
            },
            {
                title: "WordPress Blog",
                handle: "sawyerbraun",
                url: "https://sawyerbraun.wordpress.com",
                icon: "fa-brands fa-wordpress",
                color: "#0073aa"
            },
            {
                title: "GitHub",
                handle: "@sawsaw99-stack",
                url: "https://github.com/sawsaw99-stack",
                icon: "fa-brands fa-github",
                color: "indigo"
            },
            {
                title: "YouTube",
                handle: "@sawyer-does-stuff",
                url: "https://youtube.com/@sawyer-does-stuff",
                icon: "fa-brands fa-youtube",
                color: "red"
            },
            {
                title: "Suno",
                handle: "@sawyerdoesstuffyt",
                url: "https://suno.com/@sawyerdoesstuffyt",
                icon: "fa-solid fa-music",
                color: "amber"
            }
        ];

        const projectsData = [
            {
                title: "Star Rating Evaluator (Stellar)",
                category: "Python / Tkinter",
                description: "Evaluator app featuring nested factor trees, interactive editing, 0-100 vs 5-star displays, and JSON import/export.",
                tags: ["Python", "Tkinter", "JSON", "Desktop App"],
                icon: "fa-solid fa-star-half-stroke",
                iconColor: "text-amber-400 bg-amber-500/10 border-amber-500/20",
                codeUrl: "https://github.com/sawsaw99-stack/Stellar"
            },
            {
                title: "MicroPython Calculator Engine",
                category: "MicroPython / Embedded",
                description: "Lightweight calculator math routines and quantized ML models running natively on hardware calculators.",
                tags: ["MicroPython", "ML", "Embedded"],
                icon: "fa-solid fa-calculator",
                iconColor: "text-emerald-400 bg-emerald-500/10 border-emerald-500/20",
                codeUrl: "https://github.com/sawsaw99-stack"
            }
        ];

        // Carousel Scroll Helper
        function scrollContainer(id, offset) {
            const el = document.getElementById(id);
            if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
        }

        // Color lookups
        const colorStyles = {
            indigo: { border: 'hover:border-indigo-500/50', shadow: 'hover:shadow-indigo-500/10', text: 'text-indigo-400', bg: 'bg-indigo-500/10 border-indigo-500/20' },
            red: { border: 'hover:border-red-500/50', shadow: 'hover:shadow-red-500/10', text: 'text-red-400', bg: 'bg-red-500/10 border-red-500/20' },
            amber: { border: 'hover:border-amber-500/50', shadow: 'hover:shadow-amber-500/10', text: 'text-amber-400', bg: 'bg-amber-500/10 border-amber-500/20' },
            emerald: { border: 'hover:border-emerald-500/50', shadow: 'hover:shadow-emerald-500/10', text: 'text-emerald-400', bg: 'bg-emerald-500/10 border-emerald-500/20' }
        };

        // Render Socials
        function renderSocials() {
            const container = document.getElementById('socials-track');
            if (!container) return;

            container.innerHTML = socialsData.map(social => {
                const style = colorStyles[social.color] || colorStyles.indigo;
                return `
                    <a href="${social.url}" target="_blank" rel="noopener noreferrer" 
                       class="group min-w-[240px] md:min-w-[260px] snap-start flex flex-col justify-between p-5 bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl ${style.border} transition-all duration-300 hover:shadow-xl ${style.shadow} hover:-translate-y-1">
                        <div class="flex items-start justify-between mb-4">
                            <div class="w-12 h-12 rounded-xl ${style.bg} border flex items-center justify-center ${style.text}">
                                <i class="${social.icon} text-2xl"></i>
                            </div>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:text-slate-300 transition-colors"></i>
                        </div>
                        <div>
                            <h3 class="text-base font-bold text-white">${social.title}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">${social.handle}</p>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // Render Projects
        function renderProjects() {
            const container = document.getElementById('projects-track');
            if (!container) return;

            container.innerHTML = projectsData.map(proj => `
                <div class="min-w-[300px] md:min-w-[340px] snap-start flex flex-col justify-between p-5 bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl hover:border-slate-700 transition-all duration-300">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-lg ${proj.iconColor} border flex items-center justify-center text-sm">
                                    <i class="${proj.icon}"></i>
                                </div>
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${proj.category}</span>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">${proj.title}</h3>
                        <p class="text-xs text-slate-400 leading-relaxed mb-4 line-clamp-3">${proj.description}</p>
                    </div>
                    <div>
                        <div class="flex flex-wrap gap-1.5 mb-4">
                            ${proj.tags.map(t => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-800/80 border border-slate-700 text-slate-300">${t}</span>`).join('')}
                        </div>
                        <a href="${proj.codeUrl}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center gap-2 text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors">
                            <i class="fa-solid fa-code-branch"></i> View Code
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // GitHub Commit Activity Check
        async function updateStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            try {
                const res = await fetch('https://api.github.com/users/sawsaw99-stack/events/public');
                if (!res.ok) throw new Error();
                const events = await res.json();
                if (events && events.length > 0) {
                    const lastEvent = new Date(events[0].created_at);
                    const hoursAgo = (Date.now() - lastEvent.getTime()) / (1000 * 60 * 60);
                    if (hoursAgo <= 12) {
                        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
                        text.textContent = 'Active recently';
                        return;
                    }
                }
                dot.className = 'w-2 h-2 rounded-full bg-slate-500';
                text.textContent = 'Away';
            } catch {
                dot.className = 'w-2 h-2 rounded-full bg-slate-500';
                text.textContent = 'Offline';
            }
        }

        // DOM Ready Invocation
        document.addEventListener('DOMContentLoaded', () => {
            renderSocials();
            renderProjects();
            updateStatus();
        });
    </script>
</body>
</html>
